<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Management System -  Password</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <style>
    body {
      background-color: #f8f9fa;
    }
    .forgot-container {
      max-width: 400px;
      margin: 100px auto;
    }
    .card {
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .card-header {
      background-color: #4e73df;
      color: white;
      text-align: center;
      border-radius: 10px 10px 0 0 !important;
      padding: 20px;
    }
    .btn-primary {
      background-color: #4e73df;
      border-color: #4e73df;
    }
    .btn-primary:hover {
      background-color: #2e59d9;
      border-color: #2e59d9;
    }
    .btn-secondary {
      background-color: #858796;
      border-color: #858796;
    }
    .btn-secondary:hover {
      background-color: #717384;
      border-color: #717384;
    }
    .forgot-icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    .form-floating {
      margin-bottom: 1rem;
    }
    .alert {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container forgot-container">
    <div class="card">
      <div class="card-header">
        <i class="fas fa-key forgot-icon"></i>
        <h4>Create / Reset Password</h4>
      </div>
      <div class="card-body p-4">
        <div class="alert alert-danger" id="errorAlert" style="display:none"></div>
        <div class="alert alert-success" id="successAlert" style="display:none"></div>
        
        <form id="forgotPasswordForm">
          <p class="mb-3 text-muted">Enter the New password </p>
          <input type="text" class="form-control" id="token" name="token" value="<?= token; ?>" style="display:none;">
          <a style="display:none" id="pageURL" href="" target="_top">Link</a>
          <div class="form-floating mb-3">
            <input type="email" class="form-control" id="email" value="<?= email; ?>" placeholder="name@example.com" required>
            <label for="email">Email address</label>
          </div>

          <div class="form-floating mb-3">
            <input type="password" class="form-control" id="password"  required>
            <label for="password">Password</label>
          </div>

          <div class="form-floating mb-3">
            <input type="password" class="form-control" id="repassword"  required>
            <label for="repassword">ReEnter Password</label>
          </div>                    
          <div class="d-grid gap-2 mb-3">
            <button type="submit" class="btn btn-primary btn-lg" id="setpassword">
              <i class="fa fa-key"></i> Save Password
            </button>
          </div>
        </form>
        
        <div class="d-grid gap-2">
          <a href="#"  class="btn btn-secondary" id="backToLoginLink">
            <i class="fas fa-arrow-left me-2"></i> Back to Login
          </a>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Bootstrap JS Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // Forgot password form submission
document.getElementById("setpassword").addEventListener("click", function (event) {
  event.preventDefault(); // Prevent page refresh

  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value.trim();
  let repassword = document.getElementById("repassword").value.trim();
  let token = document.getElementById("token").value.trim();

  if (!email || !password || !repassword) {
    showAlert("errorAlert", "All fields are required.");
    return;
  }

  if (password.length < 6) {
    showAlert("errorAlert", "Password must be at least 6 characters.");
    return;
  }

  if (password !== repassword) {
    showAlert("errorAlert", "Passwords do not match.");
    return;
  }

  showAlert("successAlert", "Processing... Please wait.");

  google.script.run
    .withSuccessHandler(function (response) {
      if (response.success) {
        showAlert("successAlert", "Password reset successfully! Redirecting...");

          document.getElementById("backToLoginLink").click();

      } else {
        showAlert("errorAlert", response.message || "Invalid token or email.");
      }
    })
    .withFailureHandler(function (error) {
      showAlert("errorAlert", "Error: " + error.message);
    })
    .resetUserPassword(email, password, token);
});

function showAlert(alertId, message) {
  document.getElementById("successAlert").style.display = 'none';
  document.getElementById("errorAlert").style.display = 'none';
  let alertBox = document.getElementById(alertId);
  alertBox.textContent = message;
  alertBox.style.display = 'block';

}

    
    // Back to login link
    document.getElementById('backToLoginLink').addEventListener('click', function(e) {
      e.preventDefault();
      var googleappscript = '<?= ScriptApp.getService().getUrl().replace("/dev", "/exec"); ?>';
      var myAnchor = document.getElementById('pageURL');
      myAnchor.href = googleappscript ; // Assigning the URL to the href attribute
      myAnchor.click();
      document.getElementById("pageURL").click();
    });
  </script>
</body>
</html>
